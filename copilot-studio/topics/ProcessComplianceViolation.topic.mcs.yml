# Name: Compliance Violation Detection
kind: AdaptiveDialog
modelDescription: Guides evaluating a process app against compliance or policy documents.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Compliance Violation Detection
    triggerQueries:
      - compliance check
      - GDPR BAW
      - SOX process
      - process-compliance-violation-detection
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_E6kJBN4S
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding process-compliance-violation-detection. Explain inputs (TWX or docs), violation/gap reporting, and remediation using documented BAW/CP4BA capabilities.