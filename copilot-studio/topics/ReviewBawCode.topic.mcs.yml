# Name: Review BAW Code
kind: AdaptiveDialog
modelDescription: Performs guidance for severity-ranked BAW script and coach code reviews.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Review BAW Code
    triggerQueries:
      - review BAW code
      - hardcoded values in BAW
      - coach script review
      - review-baw-code
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_CKBEmV3c
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding review-baw-code. Explain common Critical/High findings (hardcoded URLs/credentials, undeclared tw.local, Thread.sleep, unbounded loops) and how to structure a review report.