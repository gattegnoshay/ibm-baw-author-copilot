# Name: Endpoint Validation
kind: AdaptiveDialog
modelDescription: Guides validating hardcoded endpoints before moving a TWX to a new server.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Endpoint Validation
    triggerQueries:
      - endpoint validation
      - hardcoded endpoints
      - BPMConfig export
      - baw-endpoint-validation
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_2jOiLk2Y
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding baw-endpoint-validation. Explain BPMConfig properties, TWX scans for old hosts, and remediation report structure.