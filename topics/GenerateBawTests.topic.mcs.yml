# Name: Generate BAW Tests
kind: AdaptiveDialog
modelDescription: Helps design automated test suites for BAW processes and coaches.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Generate BAW Tests
    triggerQueries:
      - generate BAW tests
      - test process app
      - coach validation tests
      - generate-baw-tests
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_aZI56LI1
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding generate-baw-tests. Explain Phase A suite generation and Phase B execution concepts, happy/alt/edge paths, and coach validation. Note live execution needs credentials this guidance agent does not use.