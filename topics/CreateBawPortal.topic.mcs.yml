# Name: Create BAW Portal
kind: AdaptiveDialog
modelDescription: Guides custom BAW task portal development using public REST APIs.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Create BAW Portal
    triggerQueries:
      - create BAW portal
      - task dashboard
      - WLE REST portal
      - PFS federated portal
      - create-baw-portal
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_MpRkaHt4
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding create-baw-portal. Cover non-federated WLE REST vs PFS, auth/CORS/XSRF, pagination, iframe CSP prerequisites, and suggested stacks (React default, single HTML). Guidance only — no live API calls.