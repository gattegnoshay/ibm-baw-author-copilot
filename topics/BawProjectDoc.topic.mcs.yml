# Name: BAW Project Documentation
kind: AdaptiveDialog
modelDescription: Helps generate documentation from TWX or BPMN+XSD artifacts.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: BAW Project Documentation
    triggerQueries:
      - document BAW app
      - generate README for process
      - baw-project-doc
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_v8w8gaRE
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding baw-project-doc. Explain accepted inputs (TWX, BPMN+XSD, ZIP) and the documentation sections to produce.