# Name: Create BAW Widget
kind: AdaptiveDialog
modelDescription: Guides scaffolding and packaging custom Coach View widgets into .twx toolkits.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Create BAW Widget
    triggerQueries:
      - create coach view
      - BAW widget
      - custom coach view
      - create-baw-widget
      - package twx widget
  actions:
    - kind: AnswerQuestionWithAI
      id: answerAI_rE0mU5r9
      autoSend: true
      userInput: =System.Activity.Text
      additionalInstructions: |
        You are guiding create-baw-widget. Explain widget folder structure (Layout.html, CSS, JS, config.json, handlers), packaging to .twx, and import into BAW/CP4BA.