# Name: Compare BAW Versions
kind: AdaptiveDialog
modelDescription: Guides comparing two snapshots or branches of a process application.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Compare BAW Versions
    triggerQueries:
      - compare snapshots
      - diff BAW versions
      - compare-baw-versions
  actions:
